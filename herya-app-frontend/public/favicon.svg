<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Herya</title>
  <!-- Same geometry as BreathMark: two arcs, surya and chandra, with the two
       gaps standing for the retentions that belong to the breath cycle.
       Colours are literal here because a favicon resolves no CSS variables. -->
  <rect width="48" height="48" rx="11" fill="#1b1e3c"/>
  <path d="M 26.95 7.26 A 17.0 17.0 0 0 1 26.95 40.74" stroke="#f2a03d" stroke-width="7.0" stroke-linecap="round" fill="none"/>
  <path d="M 21.05 40.74 A 17.0 17.0 0 0 1 21.05 7.26" stroke="#5b8def" stroke-width="7.0" stroke-linecap="round" fill="none"/>
</svg>
