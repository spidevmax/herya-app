name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # This job used to only run when the condition below was true:
  #   contains(github.event.head_commit.modified, 'herya-app-frontend/')
  #
  # That never worked. `modified` is a list of full file paths such as
  # "herya-app-frontend/src/App.jsx", and contains() looks for a whole matching
  # item in the list, not a prefix. So the condition was always false on a push
  # and the frontend was only checked on pull requests.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herya-app-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herya-app-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --maxWorkers=1
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herya-app-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herya-app-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run check
