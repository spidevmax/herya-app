name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # This job used to be gated on
  #   contains(github.event.head_commit.modified, 'herya-app-frontend/')
  # but `modified` is an array of full file paths, and contains() matches whole
  # elements — never the 'herya-app-frontend/' prefix. The condition was always
  # false on push, so the frontend was only ever checked on pull requests.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herya-app-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herya-app-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --maxWorkers=1
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herya-app-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herya-app-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run check
