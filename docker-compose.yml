name: herya-app

services:
  backend:
    build:
      context: ./herya-app-backend
      target: dev
    container_name: herya-backend-dev
    env_file:
      - ./herya-app-backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./herya-app-backend:/app
      # Keeps the container's node_modules (Linux binaries) from being shadowed
      # by the host's macOS build.
      - /app/node_modules
    healthcheck:
      # node:22-alpine ships no curl — probe with node's own fetch instead,
      # matching the HEALTHCHECK defined in the backend Dockerfile.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./herya-app-frontend
      target: dev
    container_name: herya-frontend-dev
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./herya-app-frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
